<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#07101f"/>
  <title>乘务培训系统</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚇</text></svg>"/>
  <script>
  /* ── 一周七套主题轮转（周一 → 周日）────────────────────────────
     每周按「星期几」自动换一套主题；不写 data-theme 即用默认地铁蓝。
     · 想临时锁定某套：网址后加 ?theme=shouyi（或 ?theme=default 用地铁蓝）
     · 想改成随机：把 WEEK[new Date().getDay()] 换成按日期做种子的伪随机
       （用日期当种子 → 同一天全系统一致，且每天不重样）          */
  (function(){
    var WEEK = {
      1:{t:'',            c:'#07101f'}, /* 周一 · 地铁蓝（默认）   */
      2:{t:'shouyi',      c:'#1d0908'}, /* 周二 · 首义红           */
      3:{t:'bianzhong',   c:'#001417'}, /* 周三 · 编钟青           */
      4:{t:'fangcao',     c:'#051408'}, /* 周四 · 芳草绿           */
      5:{t:'shouyi-deep', c:'#1d0909'}, /* 周五 · 首义红·深绛      */
      6:{t:'light',       c:'#f3f3f3'}, /* 周六 · Win11 浅色       */
      0:{t:'fluent-dark', c:'#202020'}  /* 周日 · Win11 深色       */
    };
    var q = (location.search.match(/[?&]theme=([\w-]+)/) || [])[1];
    var d = q ? (q === 'default' ? {t:'', c:'#07101f'} : {t:q, c:''})
              : (WEEK[new Date().getDay()] || WEEK[1]);
    if (d.t) document.documentElement.setAttribute('data-theme', d.t);
    if (d.c) { var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', d.c); }
  })();
  </script>
  <style>html,body{margin:0;padding:0;overflow:hidden;overscroll-behavior:none;}</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
